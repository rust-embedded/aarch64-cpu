name: Build

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  check_formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v7
    - run: cargo fmt -- --check
    - run: cd examples/armv8-r && cargo fmt -- --check

  test:
    name: Test
    needs: check_formatting
    strategy:
      fail-fast: false
      matrix:
        platform: [
          ubuntu-latest,
          macos-latest,
          windows-latest
        ]
        target: &targets [
          aarch64-unknown-none-softfloat,
          aarch64-unknown-none,
          x86_64-unknown-linux-gnu,
        ]
        variant: [
          "",           # debug
          "--release"
        ]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: ${{ matrix.target }}

    - name: Print Rust version
      run: |
        rustc -Vv
        cargo -Vv

    - name: Build package with all warnings denied
      run: cargo build ${{ matrix.variant }} --target=${{ matrix.target }}
      env:
        RUSTFLAGS: "-D warnings"

  unit-tests:
    name: FVP/QEMU based unit tests
    needs: check_formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Install QEMU
      run: |
        sudo apt-get -y update
        sudo apt-get -y install libpixman-1-0 libfdt1 libglib2.0-0t64
        curl -sSL https://github.com/jonathanpallant/qemu9-for-ubuntu-2404/releases/download/qemu-10.2.2%2Bbuild0/qemu-10.2.2-ubuntu-24.04.tar.gz | sudo tar xvzf - -C /

    - name: "Install Just"
      uses: "taiki-e/install-action@just"

    - name: Install FVP
      run: |
        mkdir /tmp/fvp
        cd /tmp/fvp && curl -LO https://developer.arm.com/-/cdn-downloads/permalink/FVPs-Architecture/FM-11.30/FVP_Base_AEMv8R_11.30_27_Linux64.tgz
        cd /tmp/fvp && tar xf FVP_Base_AEMv8R_11.30_27_Linux64.tgz

    - name: Run Tests
      run: PATH="/tmp/fvp/AEMv8R_base_pkg/models/Linux64_GCC-9.3/:/opt/qemu/bin:$PATH" just test

  clippy:
    name: Clippy
    needs: check_formatting
    strategy:
      matrix:
        target: *targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - run: rustup target add ${{ matrix.target }}
    - run: cargo clippy --target=${{ matrix.target }}

  armv8r-examples:
    name: Build ARMv8-R Examples
    needs: check_formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: cd examples/armv8-r && cargo build --bins
